[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sniptext"
version = "0.5.0"
description = "Screen capture OCR for Linux with per-image Tesseract preprocessing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "korbelainen", email = "officialpand@gmail.com"}
]
keywords = ["ocr", "screenshot", "tesseract", "linux", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Text Processing",
]

dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0",
    "ruff>=0.1.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/dkorbelainen/sniptext"
Repository = "https://github.com/dkorbelainen/sniptext"
Issues = "https://github.com/dkorbelainen/sniptext/issues"

[project.scripts]
sniptext = "sniptext.__main__:main"

[tool.setuptools]
packages = ["sniptext"]

[tool.setuptools.package-data]
sniptext = ["py.typed", "man/sniptext.1", "data/*.json"]

# Man page is shipped as package data instead of using the deprecated
# [tool.setuptools.data-files] / data_files mechanism.

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["__pycache__", "*.egg-info", ".github", "benchmarks/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

